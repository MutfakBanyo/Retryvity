[project]
name = "corona-doctor"
version = "0.1.0"
description = "Diagnostic, optimization and repair assistant for 3ds Max + Chaos Corona."
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["corona_doctor/tests", "revision_guard/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
